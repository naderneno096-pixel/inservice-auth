<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Service | استعادة كلمة المرور</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#152338;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;max-width:520px;width:100%;border-radius:18px;padding:30px;box-shadow:0 12px 35px #102b4918}h1{font-size:24px;margin:0 0 12px}p{line-height:1.8;color:#526177}label{display:block;font-weight:bold;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #cad3df;border-radius:9px;font-size:15px;direction:ltr;text-align:left}button{background:#1457b3;color:#fff;border:0;padding:14px;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer;width:100%;margin-top:20px}button:disabled{opacity:.5;cursor:wait}.status{white-space:pre-wrap;background:#edf3fb;padding:12px;border-radius:9px;margin-top:18px;line-height:1.7}.note{font-size:13px}.hidden{display:none}
</style>
</head>
<body><main class="card">
<h1>In Service — استعادة كلمة المرور</h1>
<p>هذه الصفحة مخصصة لتغيير كلمة مرور حسابك الحالي في Supabase، دون إنشاء حساب جديد.</p>
<label for="key">مفتاح Supabase العام (Publishable أو anon)</label>
<input id="key" type="password" autocomplete="off" placeholder="sb_publishable_... أو eyJ...">
<p class="note">استخدم المفتاح العام فقط. لا تستخدم أبدًا Secret key أو service_role.</p>
<button id="verify">التحقق من رابط الاستعادة</button>
<section id="reset" class="hidden">
<label for="password">كلمة المرور الجديدة</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" placeholder="12 حرفًا على الأقل">
<label for="confirm">تأكيد كلمة المرور الجديدة</label>
<input id="confirm" type="password" autocomplete="new-password">
<button id="change">تغيير كلمة المرور</button>
</section>
<div id="status" class="status" role="status">افتح الصفحة من رابط الاستعادة المرسل إلى بريدك، ثم أدخل مفتاح المشروع العام واضغط التحقق.</div>
</main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const url='https://uxuvzpeuacrmhggbafly.supabase.co';
const $=id=>document.getElementById(id);
let client=null;
const say=s=>$('status').textContent=s;
$('verify').addEventListener('click',async()=>{
 const key=$('key').value.trim();
 if(!key){say('أدخل مفتاح Supabase العام أولًا.');return;}
 $('verify').disabled=true;
 try{
  client=createClient(url,key,{auth:{detectSessionInUrl:true,persistSession:false,autoRefreshToken:false}});
  const {data,error}=await client.auth.getSession();
  if(error)throw error;
  if(!data.session){say('لا توجد جلسة استعادة صالحة. افتح رابط الاستعادة الجديد من البريد، وليس عنوان الموقع مباشرة.');return;}
  $('reset').classList.remove('hidden');
  say('تم التحقق من جلسة الاستعادة. أدخل كلمة مرور جديدة.');
 }catch(e){say('تعذر التحقق: '+(e.message||String(e))+'\nتأكد أن رابط الاستعادة حديث وأن المفتاح عام وصحيح.');}
 finally{$('verify').disabled=false;}
});
$('change').addEventListener('click',async()=>{
 const pw=$('password').value;
 if(pw.length<12){say('اختر كلمة مرور لا تقل عن 12 حرفًا.');return;}
 if(pw!==$('confirm').value){say('كلمتا المرور غير متطابقتين.');return;}
 $('change').disabled=true;
 try{
  const {error}=await client.auth.updateUser({password:pw});
  if(error)throw error;
  say('تم تغيير كلمة المرور بنجاح. يمكنك الآن استخدام كلمة المرور الجديدة لتسجيل الدخول.');
  $('password').value='';$('confirm').value='';$('reset').classList.add('hidden');
  await client.auth.signOut();
  history.replaceState({},'',location.pathname);
 }catch(e){say('تعذر تغيير كلمة المرور: '+(e.message||String(e)));}
 finally{$('change').disabled=false;}
});
</script></body></html>
